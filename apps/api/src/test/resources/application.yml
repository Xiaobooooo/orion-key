server:
  port: 8083
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:mail.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:your_password}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000

upload:
  path: ./test-uploads
  url-prefix: /uploads

logging:
  level:
    com.orionkey: DEBUG
